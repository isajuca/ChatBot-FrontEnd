<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentosBot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/mensagem.png" type="image/png">
</head>
<body>

    <!-- PAINEL ESQUERDO -->
    <div class="panel-left">
        <div class="panel-left-inner">
            <div class="panel-image">
                <img src="images/foto.png" alt="Imagem do painel esquerdo">
            </div>

            <div class="controls">
                <button id="iniciarBtn" class="btn btn-start">
                    <i class="fa-regular fa-comment-dots"></i> Iniciar conversa
                </button>
                <button id="limparBtn" class="btn btn-clear">
                    <i class="fa-solid fa-rotate-right"></i> Limpar tela
                </button>
                <button id="encerrarBtn" class="btn btn-end">
                    <i class="fa-solid fa-power-off"></i> Encerrar conversa
                </button>
            </div>
        </div>
    </div>

    <!-- PAINEL DIREITO (CHAT) -->
    <div class="panel-right">
        <header class="chat-header">
            <div class="header-left">
                <div class="header-icon"><img src="images/mensagem.png" alt="Ícone do chat" width="46"></div>
                <div>
                    <h2>SentimentosBot</h2>
                    <p>Seu amigo para todas as horas</p>
                </div>
            </div>
            <div id="connection-status" class="status-badge status-offline">
                <span class="status-dot"></span> Desconectado
            </div>
        </header>

        <div id="chat-box" class="chat-box"></div>

        <footer class="chat-input-area">
            <span class="input-heart"><img src="images/coracao.png" alt="Ícone de coração" width="60"></span>
            <input type="text" id="message-input" placeholder="Digite sua mensagem aqui..." disabled>
            <button class="emoji-btn" title="Emoji" disabled><img src="images/coracao.png" alt="Ícone de coração" width="60"></button>
            <button id="send-button" class="btn-send" disabled>
                <i class="fa-solid fa-paper-plane"></i> Enviar
            </button>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
